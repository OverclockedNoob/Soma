name: workout_tracker
description: "Soma — an offline-first adaptive workout tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/soma_icon.png"
