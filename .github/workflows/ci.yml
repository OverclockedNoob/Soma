name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting & static analysis
        run: |
          python3 - <<'PY'
          import subprocess, sys
          res = subprocess.run(["flutter", "analyze", "--no-pub"], text=True, capture_output=True)
          out = (res.stdout or "") + "\n" + (res.stderr or "")
          print(out)
          if res.returncode != 0:
              for ln in out.splitlines():
                  s = ln.strip()
                  if s and not s.startswith("Analyzing "):
                      print(f"::error title=flutter analyze::{s}")
              sys.exit(res.returncode)
          PY

      - name: Run unit & widget tests
        run: |
          python3 - <<'PY'
          import subprocess, sys
          res = subprocess.run(["flutter", "test", "--no-pub"], text=True, capture_output=True)
          out = (res.stdout or "") + "\n" + (res.stderr or "")
          print(out)
          if res.returncode != 0:
              for ln in out.splitlines()[-25:]:
                  s = ln.strip()
                  if s:
                      print(f"::error title=flutter test::{s}")
              sys.exit(res.returncode)
          PY

      - name: Build debug APK
        run: flutter build apk --debug --no-pub
