name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: |
          python3 - <<'PY'
          import subprocess, sys
          res = subprocess.run(["flutter", "analyze", "--no-pub"], text=True, capture_output=True)
          out = (res.stdout or "") + "\n" + (res.stderr or "")
          issues = []
          for ln in out.splitlines():
              s = ln.strip()
              if ("error •" in s or "warning •" in s or "info •" in s):
                  # Flutter 3.47+ emits an info notice for package:flutter/material.dart -> material_ui,
                  # while Soma supports Flutter >=3.44.0 where package:flutter/material.dart is required.
                  if "'package:flutter/material.dart' is deprecated" in s:
                      continue
                  issues.append(s)
          if issues:
              for item in issues:
                  print(item)
                  print(f"::error title=flutter analyze::{item}")
              sys.exit(1)
          print("flutter analyze passed with 0 errors, warnings, or lint issues.")
          PY

      - name: Run unit & widget tests
        run: |
          python3 - <<'PY'
          import subprocess, sys
          res = subprocess.run(["flutter", "test", "--no-pub"], text=True, capture_output=True)
          out = (res.stdout or "") + "\n" + (res.stderr or "")
          print(out)
          if res.returncode != 0:
              lines = [ln.strip() for ln in out.splitlines() if ln.strip()]
              interesting = [
                  ln for ln in lines
                  if any(k in ln for k in ("EXCEPTION", "thrown", "Error", "Failed", "pending", "Timer", "RenderFlex", "package:workout_tracker", "widget_test.dart"))
              ]
              for ln in (interesting[:10] if interesting else lines[-10:]):
                  print(f"::error title=flutter test::{ln}")
              sys.exit(res.returncode)
          PY

      - name: Build release APK
        run: |
          python3 - <<'PY'
          import subprocess, sys
          res = subprocess.run(["flutter", "build", "apk", "--release", "--no-pub"], text=True, capture_output=True)
          out = (res.stdout or "") + "\n" + (res.stderr or "")
          print(out)
          if res.returncode != 0:
              for ln in out.splitlines()[-20:]:
                  s = ln.strip()
                  if s:
                      print(f"::error title=flutter build apk::{s}")
              sys.exit(res.returncode)
          PY
